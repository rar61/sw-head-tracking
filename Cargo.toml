[workspace]
members = ["freetrack-client","minhook-sys"]

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_WindowsProgramming",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging"
]

[package]
name = "sw-head-tracking"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "sw-loader"
path = "src/main.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
minhook-sys = { path = "minhook-sys", features = [ "build-from-source", "static" ] }
freetrack-client = { path = "freetrack-client" }
windows.workspace = true
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
