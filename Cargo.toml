[workspace]
members = ["freetrack-client","minhook-sys"]

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_WindowsProgramming",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_Globalization"
]

[package]
name = "sw-head-tracking"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
minhook-sys = { path = "minhook-sys", features = [ "build-from-source", "static" ] }
freetrack-client = { path = "freetrack-client" }
windows.workspace = true
